[project]
name = "simple-rag-chatbot"
version = "0.1.0"
description = "Modular RAG chatbot for company documentation with multi-vector retrieval, metadata enrichment, reranking, and LangGraph"
readme = "README.md"
authors = [
    { name = "Shoaib Akthar", email = "shoaibakthar.work@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "docling>=2.141.0",
    "langchain-core>=1.6.12",
    "langchain-groq>=1.1.3",
    "langgraph>=0.2.0",
    "pydantic>=2.14.1",
    "pypdf>=5.0.0",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=6.2.0",
]

[project.scripts]
simple-rag-chatbot = "simple_rag_chatbot.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
